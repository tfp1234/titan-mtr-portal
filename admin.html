<script>
    async function performSearch() {
      const input = document.getElementById('searchInput').value.trim().toUpperCase();
      const noResBox = document.getElementById('noResults');
      if (noResBox) noResBox.classList.add('hidden');

      if (!input) return;

      try {
        const response = await fetch('mtr-database.json');
        const db = response.ok ? await response.json() : [];
        const record = db.find(item => item.heat.toUpperCase() === input);

        if (!record) {
          if (noResBox) noResBox.classList.remove('hidden');
          return;
        }

        document.getElementById('manualHeat').value = record.heat || '';
        document.getElementById('manualDesc').value = record.description || '';
        document.getElementById('manualSpecs').value = record.specs || '';
        document.getElementById('manualHeatTreat').value = record.heatTreatment || '';
        document.getElementById('manualDim').value = (record.dimension || '') + ' / ' + (record.threads || '');
        
        const c = record.chem || {};
        document.getElementById('mC').value = c.c || '';
        document.getElementById('mMn').value = c.mn || '';
        document.getElementById('mP').value = c.p || '';
        document.getElementById('mS').value = c.s || '';
        document.getElementById('mSi').value = c.si || '';
        document.getElementById('mCr').value = c.cr || '';
        document.getElementById('mNi').value = c.ni || '';
        document.getElementById('mMo').value = c.mo || '';
        document.getElementById('mCu').value = c.cu || '';
        document.getElementById('mV').value = c.v || '';
        document.getElementById('mAl').value = c.al || '';
        document.getElementById('mTi').value = c.ti || '';
        document.getElementById('mB').value = c.b || '';
        document.getElementById('mNb').value = c.nb || '';
        document.getElementById('mCe').value = c.ce || '';

        const m = record.mech || {};
        document.getElementById('mTensile').value = m.tensile || '';
        document.getElementById('mYield').value = m.yield || '';
        document.getElementById('mElong').value = m.elong || '';
        document.getElementById('mRa').value = m.ra || '';
        document.getElementById('mHardness').value = m.hardness || '';
        document.getElementById('mComments').value = record.comments || '';

        generateManualCertificate();

      } catch (e) {
        console.error(e);
      }
    }

    function generateManualCertificate() {
      try {
        // Safe value getters with fallbacks
        const getVal = (id, fallback) => {
          const el = document.getElementById(id);
          return el && el.value ? el.value : fallback;
        };

        document.getElementById('lblCertNo').innerText = getVal('manualCert', 'MC26022600048');
        document.getElementById('lblHeat').innerText = getVal('manualHeat', 'N/A');
        document.getElementById('lblDescription').innerText = getVal('manualDesc', 'N/A');
        document.getElementById('lblSpecs').innerText = getVal('manualSpecs', 'N/A');
        document.getElementById('lblHeatTreatment').innerText = getVal('manualHeatTreat', 'N/A');
        document.getElementById('lblDimension').innerText = getVal('manualDim', 'N/A');

        // Chem
        document.getElementById('chemC').innerText = getVal('mC', '-');
        document.getElementById('chemMn').innerText = getVal('mMn', '-');
        document.getElementById('chemP').innerText = getVal('mP', '-');
        document.getElementById('chemS').innerText = getVal('mS', '-');
        document.getElementById('chemSi').innerText = getVal('mSi', '-');
        document.getElementById('chemCr').innerText = getVal('mCr', '-');
        document.getElementById('chemNi').innerText = getVal('mNi', '-');
        document.getElementById('chemMo').innerText = getVal('mMo', '-');
        document.getElementById('chemCu').innerText = getVal('mCu', '-');
        document.getElementById('chemV').innerText = getVal('mV', '-');
        document.getElementById('chemAl').innerText = getVal('mAl', '-');
        document.getElementById('chemTi').innerText = getVal('mTi', '-');
        document.getElementById('chemB').innerText = getVal('mB', '-');
        document.getElementById('chemNb').innerText = getVal('mNb', '-');
        document.getElementById('chemCe').innerText = getVal('mCe', '-');

        // Mech
        document.getElementById('mechTensile').innerText = getVal('mTensile', '-');
        document.getElementById('mechYield').innerText = getVal('mYield', '-');
        document.getElementById('mechElong').innerText = getVal('mElong', '-');
        document.getElementById('mechRa').innerText = getVal('mRa', '-');
        document.getElementById('mechHardness').innerText = getVal('mHardness', '-');

        document.getElementById('lblComments').innerText = getVal('mComments', '');

        // Show preview and action toolbar
        document.getElementById('printable-certificate').classList.remove('hidden');
        document.getElementById('actionToolbar').classList.remove('hidden');
        
        // Scroll smoothly down to the preview
        document.getElementById('printable-certificate').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert("Error generating certificate: " + err.message);
      }
    }
  </script>
